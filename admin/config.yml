# Decap CMS configuration
# Docs: https://decapcms.org/docs/add-to-your-site/
#
# IMPORTANT - before this admin panel will let anyone log in:
# 1. Deploy this site to Netlify (see README.md).
# 2. Enable Identity and Git Gateway in Site settings on Netlify.
# 3. Invite editors under Identity - they log in with email/password,
#    no GitHub account needed.

backend:
  name: git-gateway
  branch: main

# Where the CMS commits media uploads.
media_folder: "img"
public_folder: "/img"

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["AI in Education"] }
      - { label: "Hero Image", name: "image", widget: "image", required: false, hint: "Uploads save into /img. Reference the resulting path here." }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on blog cards." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "articles"
    label: "Curated Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Source Name", name: "source", widget: "string" }
      - { label: "External URL", name: "url", widget: "string" }
      - { label: "Why It Matters", name: "commentary", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  - name: "books"
    label: "Books & Publications"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false, hint: "Uploads save into /img. Reference the resulting path here." }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Link URL", name: "link_url", widget: "string", hint: "Where the buy/view link should point." }
      - { label: "Link Text", name: "link_text", widget: "string", default: "Buy the book" }
      - { label: "Order", name: "order", widget: "number", default: 1, hint: "Lower numbers show first." }
